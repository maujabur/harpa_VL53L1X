; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Firmware da harpa rodando no Arduino Leonardo (ATmega32u4).
; O core AVR nao possui STL: os headers usam <stdint.h>/<stddef.h> e um
; substituto minimo de std::array (harpa::Array) definido em harpa_array.h.
[env:leonardo]
platform = atmelavr
board = leonardo
framework = arduino
monitor_speed = 115200
; As funcoes constexpr de validacao em lidar_config.h tem multiplos
; statements, o que exige C++14 (o core AVR usa C++11 por padrao).
build_unflags = -std=gnu++11
build_flags = -std=gnu++14
lib_deps =
    pololu/VL53L1X @ ^1.3.1
    arduino-libraries/Keyboard @ ^1.0.6

; Ambiente de testes unitarios (Unity) para rodar no host, onde a STL existe.
; Execute com: pio test -e native
[env:native]
platform = native
test_build_src = yes
lib_deps =
    throwtheswitch/Unity @ ^2.6.1
